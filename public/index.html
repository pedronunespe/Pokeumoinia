<body class="home-page">

    <div class="capa">
        <div class="container">
            <h1>Uma floresta de lembranças</h1>
            <p id="fraseAleatoria"></p>
            
            <a class="botao" href="jornada.html">Conheça minha jornada</a>
        </div>
    </div>

    <script>
        var frases = [
            "O anime de transformou o que era \"entediante\" em paixão.",
            "Um jogo desconhecido chamado Pokemon Brick Bronze, o jogo qua mais marcou minha história com a franquia.",
            "O anime do X & Y me conquistaram de vez, o que me fez ter tanto apreço com este mundo.",
            "Legends: Arceus foi meu primeiro título oficial no Switch: 90% em uma noite.",
            "O Pokeumonia guarda minha jornada e memórias.",
            "Do Pixelmon ao Cobblemon, mods que me fizeram voltar a jogar.","Do anime em 2013 aos dias atuais, esta é a minha trajetória com Pokémon."
        ];

        function mostrarFraseAleatoria() {
            var indice = Math.floor(Math.random() * frases.length);
            document.querySelector("#fraseAleatoria").innerHTML = frases[indice];
        }

        mostrarFraseAleatoria();
    </script>
