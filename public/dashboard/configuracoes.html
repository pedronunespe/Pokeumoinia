<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokeumonia | Configurações</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard-style.css">
    <script src="../js/sessao.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
</head>

<body onload="montarSidebar('configuracoes.html'); validarSessao()">

    <div class="app-layout">
        <aside class="sidebar" id="app_sidebar"></aside>

        <main class="conteudo">
            <div class="cabecalho-pagina">
                <div>
                    <h1>Configurações</h1>
                    <p>Ajuste o perfil do treinador e amplie os catálogos usados nos cadastros.</p>
                </div>
                <a class="botao botao-pequeno botao-secundario" href="dashboard.html">Ver dashboard</a>
            </div>

            <div class="aviso" id="mensagem_config"></div>

            <!-- Perfil 1:1 com o usuário: altera os anos de jornada da dashboard. -->
            <section class="painel">
                <h2>Perfil do treinador</h2>
                <p>O ano de início é usado no indicador "anos de jornada".</p>
                <div class="grade-form">
                    <label><span>Apelido</span><input id="cfg_apelido" type="text" maxlength="30"></label>
                    <label><span>Ano em que começou</span><input id="cfg_ano" type="number" min="1900" max="2100"></label>
                    <label><span>Pokémon favorito</span><select id="cfg_favorito"></select></label>
                    <div class="botoes"><button type="button" class="botao botao-pequeno" onclick="salvarPerfil()">Salvar perfil</button></div>
                </div>
            </section>

            <!-- Gerações alimentam o select da página de Pokémon. -->
            <section class="painel">
                <h2>Nova geração</h2>
                <div class="grade-form">
                    <label><span>Número</span><input id="cfg_gen_numero" type="number" min="1" max="99" placeholder="10"></label>
                    <label><span>Região</span><input id="cfg_gen_regiao" type="text" maxlength="30" placeholder="Ex.: Paldea"></label>
                    <div class="botoes"><button type="button" class="botao botao-pequeno" onclick="cadastrarGeracao()">Cadastrar geração</button></div>
                </div>
                <table class="tabela">
                    <thead><tr><th>Número</th><th>Região</th></tr></thead>
                    <tbody id="corpo_geracoes"></tbody>
                </table>
            </section>

            <!-- Tipos além dos já semeados, com a cor usada nos cartões. -->
            <section class="painel">
                <h2>Novo tipo</h2>
                <div class="grade-form">
                    <label><span>Nome</span><input id="cfg_tipo_nome" type="text" maxlength="20" placeholder="Ex.: Fogo"></label>
                    <label><span>Cor</span><input id="cfg_tipo_cor" type="color" value="#c9a574"></label>
                    <div class="botoes"><button type="button" class="botao botao-pequeno" onclick="cadastrarTipo()">Cadastrar tipo</button></div>
                </div>
                <table class="tabela">
                    <thead><tr><th>Cor</th><th>Nome</th></tr></thead>
                    <tbody id="corpo_tipos"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="configuracoes.js"></script>
</body>

</html>
