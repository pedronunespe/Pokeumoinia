<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokeumonia | Login</title>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-page">
    
    <div class="header">
        <div class="container">
            <a class="logo" href="index.html">Pokeumonia</a>
            <ul class="navbar">
                
                <li><a href="jornada.html">Minha jornada</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li class="agora"><a href="login.html">Login</a></li>
            </ul>
        </div>
    </div>

    
    <div class="login">
        
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card">
                <h2>Olá de volta!</h2>
                
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="email" placeholder="meuemail@provedor.com" autocomplete="username">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******" autocomplete="current-password">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                
                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div>

                <div id="div_erros_login"></div>
                <p class="troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    
    <div class="footer">
        <div class="container">
            Projeto acadêmico sem fins lucrativos. Pokémon é marca da Nintendo, Game Freak e The Pokémon Company.
        </div>
    </div>
</body>

</html>

<script>
     
    async function entrar() {
        aguardar();

         
        var emailVar = document.getElementById("email_input").value.trim();
        var senhaVar = document.getElementById("senha_input").value;

         
        if (emailVar === "" || senhaVar === "") {
            mostrarErroLogin("Preencha o e-mail e a senha.");
            finalizarAguardar();
            return false;
        }

        try {
             
            var resposta = await fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            });

             
            if (resposta.status === 403) {
                mostrarErroLogin("E-mail ou senha inválidos.");
                return false;
            }

             
            if (!resposta.ok) {
                mostrarErroLogin("Não foi possível validar o login. Confira a conexão com o servidor e o banco de dados.");
                return false;
            }

             
            var usuario = await resposta.json();
            sessionStorage.setItem("EMAIL_USUARIO", usuario.email);
            sessionStorage.setItem("NOME_USUARIO", usuario.nome);
            sessionStorage.setItem("ID_USUARIO", usuario.id);
             

             
            window.location = "./dashboard/dashboard.html";
        } catch (erro) {
             
            mostrarErroLogin("Não foi possível conectar ao servidor. Tente novamente.");
        } finally {
             
            finalizarAguardar();
        }

        return false;
    }

     
    function mostrarErroLogin(mensagem) {
        document.getElementById("mensagem_erro").textContent = mensagem;
        document.getElementById("cardErro").style.display = "block";
        setTimeout(sumirMensagem, 5000);
    }

     
    function sumirMensagem() {
        document.getElementById("cardErro").style.display = "none";
    }
</script>
