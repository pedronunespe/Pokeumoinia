<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokeumonia | Cadastro</title>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="cadastro-page">
    <div class="header">
        <div class="container">
            <a class="logo" href="index.html">Pokeumonia</a>
            <ul class="navbar">
                <li class="agora"><a href="cadastro.html">Cadastro</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </div>

    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card">
                <h2>Crie sua conta</h2>
                <div class="formulario">
                    <div class="campo">
                        <span>Nome:</span>
                        <input id="nome_input" type="text" placeholder="Seu nome" />
                    </div>
                    <div class="campo">
                        <span>Sobrenome:</span>
                        <input id="sobrenome_input" type="text" placeholder="Sobrenome" />
                    </div>
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******" oninput="mostrarRequisitosSenha()" />
                        <div id="requisitos_senha"></div>
                    </div>
                    <div class="campo">
                        <span>Confirmação da senha:</span>
                        <input id="confirmacao_senha_input" type="password" placeholder="******" />
                    </div>
                    <button class="botao" onclick="cadastrar()">Cadastrar</button>
                </div>
                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" />
                </div>

                <div id="div_erros_login"></div>
                <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            Projeto acadêmico sem fins lucrativos. Pokémon é marca da Nintendo, Game Freak e The Pokémon Company.
        </div>
    </div>
</body>

</html>

<script>
  // A API atual exige o vínculo com uma empresa durante o cadastro.
  // Para testes sem código de validação, os novos usuários ficam ligados ao ID 1.
  const ID_EMPRESA_PARA_TESTE = 1;

  function mostrarErroCadastro(mensagem) {
    cardErro.style.display = "block";
    mensagem_erro.textContent = mensagem;
  }

  function limparFormulario() {
    document.getElementById("nome_input").value = "";
    document.getElementById("sobrenome_input").value = "";
    document.getElementById("email_input").value = "";
    document.getElementById("senha_input").value = "";
    document.getElementById("confirmacao_senha_input").value = "";
  }

  // confere cada requisito da senha e devolve um objeto com true/false para cada um
  function analisarSenha(senha) {
    var resultado = {
      tamanho: senha.length >= 8,
      minuscula: false,
      maiuscula: false,
      numero: false,
      especial: false
    };

    for (var i = 0; i < senha.length; i++) {
      var letra = senha[i];

      if (letra >= "a" && letra <= "z") {
        resultado.minuscula = true;
      } else if (letra >= "A" && letra <= "Z") {
        resultado.maiuscula = true;
      } else if (letra >= "0" && letra <= "9") {
        resultado.numero = true;
      } else {
        resultado.especial = true;
      }
    }

    return resultado;
  }

  // monta uma linha do checklist: verde com ✔ se cumprido, vermelho com ✖ se não
  function linhaRequisito(cumprido, texto) {
   var cor = cumprido ? "#2e9e5b" : "#d9534f";
   var icone = cumprido ? "✔" : "✖";
   return '<span style="color:' + cor + '">' + icone + ' ' + texto + '</span><br>';
  }

  // chamada a cada letra digitada no campo de senha (oninput)
  function mostrarRequisitosSenha() {
    var senha = senha_input.value;

    if (senha == "") {
      requisitos_senha.innerHTML = "";
      return;
    }

    var r = analisarSenha(senha);

    requisitos_senha.innerHTML =
      linhaRequisito(r.tamanho, "Mínimo de 8 caracteres") +
      linhaRequisito(r.minuscula, "Uma letra minúscula") +
      linhaRequisito(r.maiuscula, "Uma letra maiúscula") +
      linhaRequisito(r.numero, "Um número") +
      linhaRequisito(r.especial, "Um caractere especial (ex.: @, #, !)");
  }

  async function cadastrar() {
    aguardar();

    var nomeVar = nome_input.value.trim();
    var sobrenomeVar = sobrenome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
      nomeVar == "" ||
      sobrenomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      mostrarErroCadastro("Preencha todos os campos.");
      finalizarAguardar();
      return false;
    }

    // validando se o email tem @ e "."
    if (!emailVar.includes("@") || !emailVar.includes(".")) {
      mostrarErroCadastro("E-mail inválido. email deve conter @ e '.'");
      setInterval(sumirMensagem, 5000);
      finalizarAguardar();
      return false;
    }

    // validando se a senha tem no minimo 8 caracteres letra minuscula, maiuscula, numero e carater especial
    var senhaAnalisada = analisarSenha(senhaVar);

    if (!senhaAnalisada.tamanho || !senhaAnalisada.minuscula || !senhaAnalisada.maiuscula || !senhaAnalisada.numero || !senhaAnalisada.especial) {
      mostrarErroCadastro("A senha deve ter no mínimo 8 caracteres, com letra maiúscula, letra minúscula, número e caractere especial.");
      setInterval(sumirMensagem, 5000);
      finalizarAguardar();
      return false;
    }

    if (senhaVar !== confirmacaoSenhaVar) {
      mostrarErroCadastro("A confirmação da senha não confere com a senha.");
      setInterval(sumirMensagem, 5000);
      finalizarAguardar();
      return false;
    }

    setInterval(sumirMensagem, 5000);

    try {
      var resposta = await fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nomeVar,
          sobrenomeServer: sobrenomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          idEmpresaVincularServer: ID_EMPRESA_PARA_TESTE
        }),
      });

      if (!resposta.ok) {
        throw new Error("Houve um erro ao tentar realizar o cadastro.");
      }

      mostrarErroCadastro("Cadastro realizado com sucesso! Redirecionando para tela de Login...");

      setTimeout(function () {
        window.location = "login.html";
      }, 2000);

      limparFormulario();
    } catch (erro) {
      mostrarErroCadastro(erro.message || "Não foi possível realizar o cadastro. Tente novamente.");
    } finally {
      finalizarAguardar();
    }

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
